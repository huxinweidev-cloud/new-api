name: Fork maintenance gate
on:
  push:
    branches: [main, inkos-integration, newapi-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install and check frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      - name: Test browser authentication and hosted entry
        working-directory: web
        run: |
          node node_modules/vitest/vitest.mjs run --maxWorkers=2 src/lib/auth-session.test.ts src/features/auth/lib/ src/features/security/__tests__/
          if test -d src/features/inkos/__tests__; then
            node node_modules/vitest/vitest.mjs run --maxWorkers=2 src/features/inkos/__tests__/
          fi
      - name: Build backend and test authentication contracts
        env:
          GOWORK: 'off'
        run: |
          go build ./...
          (cd relaykit && go build ./...)
          go test -p=2 ./controller ./middleware ./service -run 'Inkos|Auth|Session|Login' -count=1
