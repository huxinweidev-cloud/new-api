name: Sync upstream
on:
  schedule:
    - cron: '20 */8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-upstream-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - name: Require workflow-capable sync credential
        env:
          SYNC_UPSTREAM_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: test -n "$SYNC_UPSTREAM_TOKEN"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
      - name: Merge candidate without overwriting fork modifications
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch upstream main
          git merge upstream/main --no-edit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install and check frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      - name: Test browser authentication and hosted entry
        working-directory: web
        run: |
          node node_modules/vitest/vitest.mjs run --maxWorkers=2 src/lib/auth-session.test.ts src/features/auth/lib/ src/features/security/__tests__/
          if test -d src/features/inkos/__tests__; then
            node node_modules/vitest/vitest.mjs run --maxWorkers=2 src/features/inkos/__tests__/
          fi
      - name: Build backend and test authentication contracts
        env:
          GOWORK: 'off'
        run: |
          go build ./...
          (cd relaykit && go build ./...)
          go test -p=2 ./controller ./middleware ./service -run 'Inkos|Auth|Session|Login' -count=1
      - name: Publish only tested merge (non-force push)
        run: git push origin HEAD:main
